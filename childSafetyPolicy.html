function buildCard(card) {
  let h = '<div class="card ' + (card.type||'') + '">';
  if (card.body) h += '<p>' + card.body + '</p>';
  if (card.lines) card.lines.forEach(function(l){ h += '<p>' + l + '</p>'; });
  if (card.list) h += '<ul>' + card.list.map(function(l){ return '<li>'+l+'</li>'; }).join('') + '</ul>';
  if (card.bodyAfter) h += '<p>' + card.bodyAfter + '</p>';
  return h + '</div>';
}

function buildLangSwitch(current) {
  const names = {es:'ES', en:'EN', de:'DE', zh:'中文'};
  return Object.keys(names).map(function(l){
    return '<a href="?lang=' + l + '"' + (l === current ? ' class="active"' : '') + '>' + names[l] + '</a>';
  }).join('');
}

function render(lang) {
  const t = childTranslations[lang] || childTranslations['es'];
  document.documentElement.lang = lang;
  document.getElementById('header-sub').textContent = t.headerSub;
  document.title = t.headerSub + ' — Plannet';
  document.getElementById('footer-text').textContent = t.footer;
  document.getElementById('lang-switch').innerHTML = buildLangSwitch(lang);
  let html = '<h1>' + t.title + '</h1><span class="subtitle">' + t.subtitle + '</span><p>' + t.intro + '</p>';
  t.sections.forEach(function(section) {
    html += '<h2>' + section.title + '</h2>';
    section.cards.forEach(function(card) { html += buildCard(card); });
  });
  html += '<div class="contact-box"><p>' + t.contactText + '</p><a href="mailto:devlicius.online@gmail.com">devlicius.online@gmail.com</a></div>';
  document.getElementById('content').innerHTML = html;
}

const params = new URLSearchParams(window.location.search);
const lang = params.get('lang') || 'es';
render(['es','en','de','zh'].includes(lang) ? lang : 'es');

function buildLangSwitch(current) {
  const names = {es:'ES', en:'EN', de:'DE', zh:'中文'};
  return Object.keys(names).map(function(l){
    return '<a href="?lang=' + l + '"' + (l === current ? ' class="active"' : '') + '>' + names[l] + '</a>';
  }).join('');
}

let t;

function render(lang) {
  t = tr[lang] || tr['es'];
  document.documentElement.lang = lang;
  document.getElementById('header-sub').textContent = t.headerSub;
  document.title = t.headerSub + ' — Plannet';
  document.getElementById('footer-text').textContent = t.footer;
  document.getElementById('lang-switch').innerHTML = buildLangSwitch(lang);

  document.getElementById('content').innerHTML =
    '<h1>' + t.title + '</h1>' +
    '<span class="subtitle">' + t.subtitle + '</span>' +
    '<div class="card info"><h3>' + t.infoTitle + '</h3><p>' + t.infoBody + '</p><ul>' +
      t.infoList.map(function(l){ return '<li>' + l + '</li>'; }).join('') +
    '</ul></div>' +
    '<div class="card warning"><p>' + t.warning + '</p></div>' +
    '<div class="card danger" id="form-card">' +
      '<h3>' + t.formTitle + '</h3>' +
      '<p>' + t.formBody + '</p>' +
      '<div id="error-slot"></div>' +
      '<div class="form-group"><label for="user">' + t.labelUser + '</label>' +
        '<input type="text" id="user" autocomplete="username"></div>' +
      '<div class="form-group"><label for="pass">' + t.labelPass + '</label>' +
        '<input type="password" id="pass" autocomplete="current-password"></div>' +
      '<div class="form-group"><label style="text-transform:none;font-weight:400">' +
        '<input type="checkbox" id="confirm" style="width:auto;margin-right:8px"> ' +
        t.checkLabel + '</label></div>' +
      '<button id="btn-delete">' + t.btn + '</button>' +
      '<p style="margin-top:16px;font-size:13px;color:#777">' + t.socialNote +
        ' <a href="mailto:devlicius.online@gmail.com">devlicius.online@gmail.com</a></p>' +
    '</div>' +
    '<div class="contact-box"><p>' + t.contactText + '</p>' +
      '<a href="mailto:devlicius.online@gmail.com">devlicius.online@gmail.com</a></div>';

  document.getElementById('btn-delete').addEventListener('click', deleteAccount);
}

function showError(msg) {
  document.getElementById('error-slot').innerHTML =
    '<div class="error-msg">' + msg + '</div>';
}

function mapError(code) {
  switch (code) {
    case 'INVALID_CREDENTIALS': return t.errInvalid;
    case 'ACCOUNT_NOT_VERIFIED': return t.errNotVerified;
    case 'ACCOUNT_BANNED': return t.errBanned;
    case 'PASSWORD_REQUIRED': return t.errFields;
    default: return t.errGeneric;
  }
}

async function deleteAccount() {
  const user = document.getElementById('user').value.trim();
  const pass = document.getElementById('pass').value;
  const confirmed = document.getElementById('confirm').checked;
  const btn = document.getElementById('btn-delete');

  document.getElementById('error-slot').innerHTML = '';

  if (!user || !pass) return showError(t.errFields);
  if (!confirmed) return showError(t.errCheck);

  btn.disabled = true;
  btn.textContent = t.btnLoading;

  try {
    // 1. Login para obtener el token
    const loginRes = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({emailOrNick: user, password: pass})
    });

    if (!loginRes.ok) {
      const data = await loginRes.json().catch(function(){ return {}; });
      throw new Error(data.code || 'GENERIC');
    }

    const {accessToken} = await loginRes.json();

    // 2. Borrar la cuenta
    const delRes = await fetch(API + '/api/users/me', {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + accessToken
      },
      body: JSON.stringify({password: pass})
    });

    if (!delRes.ok) {
      const data = await delRes.json().catch(function(){ return {}; });
      throw new Error(data.code || 'GENERIC');
    }

    // 3. Confirmacion
    document.getElementById('form-card').outerHTML =
      '<div class="card success-card">' +
        '<div class="success-icon">✓</div>' +
        '<h2>' + t.okTitle + '</h2>' +
        '<p>' + t.okBody + '</p>' +
      '</div>';

  } catch (e) {
    showError(mapError(e.message));
    btn.disabled = false;
    btn.textContent = t.btn;
  }
}

const params = new URLSearchParams(window.location.search);
const lang = params.get('lang') || 'es';
render(['es','en','de','zh'].includes(lang) ? lang : 'es');
